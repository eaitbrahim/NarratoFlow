name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - name: Install ffmpeg
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends ffmpeg
      - run: ffmpeg -hide_banner -filters | grep -qE '^ ... ass '
      - run: uv sync --locked --group dev
      - run: uv run ruff check --no-cache .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
