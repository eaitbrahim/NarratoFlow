[project]
name = "narratoflow"
version = "0.1.0"
description = "Open-source whiteboard animation video engine for Classical Arabic and English."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "scikit-image>=0.23",
    "pyarabic>=0.6.15",
    "httpx>=0.27",
]

[project.optional-dependencies]
arabic = ["mishkal>=0.4.1", "camel-tools>=1.5"]
tts-edge = ["edge-tts>=7.0,<8"]
tts-local = ["piper-tts>=1.2"]
align = ["ctc-forced-aligner>=0.3"]
diffusion = ["torch>=2.3", "diffusers>=0.30", "transformers>=4.44", "controlnet-aux>=0.0.9"]
ui = ["gradio>=5.0"]
all = ["narratoflow[arabic,tts-edge,tts-local,align,diffusion,ui]"]

[project.scripts]
narratoflow = "narratoflow.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narratoflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["narratoflow"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
