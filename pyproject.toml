[project]
name = "narratoflow"
version = "0.1.0"
description = "Open-source whiteboard animation video engine for Classical Arabic and English."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "scikit-image>=0.23",
    "pyarabic>=0.6.15",
    "httpx>=0.27",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.20.1",
    "anthropic>=2.8",
    "fonttools>=4.53",
]

[project.optional-dependencies]
arabic = ["mishkal>=0.4.1", "camel-tools>=1.5"]
tts-edge = ["edge-tts>=7.0,<8"]
tts-local = ["piper-tts>=1.3"]
align = ["ctc-forced-aligner>=1.0.2,<2", "unidecode>=1.3"]
diffusion = ["torch>=2.3", "diffusers>=0.30", "transformers>=4.44"]
ui = ["gradio>=5.0"]
all = ["narratoflow[arabic,tts-edge,tts-local,align,diffusion,ui]"]

[project.scripts]
narratoflow = "narratoflow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.6",
    "httpx2==2.16.0",
    "hatchling",
    "svgelements>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narratoflow"]

[tool.hatch.build.targets.wheel.force-include]
"assets/fonts" = "narratoflow/assets/fonts"
"assets/hands" = "narratoflow/assets/hands"
"assets/icons" = "narratoflow/assets/icons"
"assets/reciters" = "narratoflow/assets/reciters"
"assets/sfx" = "narratoflow/assets/sfx"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "G", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "pyarabic.*",
    "mishkal.*",
    "skimage.*",
    "diffusers.*",
    "torch.*",
    "edge_tts.*",
    "piper.*",
    "ctc_forced_aligner.*",
    "onnxruntime.*",
    "unidecode.*",
    "fontTools.*",
    "svgelements.*",
    "gradio.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/narratoflow"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: builds a wheel; kept in the default run and in CI"]
